<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLogistics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="16" fill="url(#bgLogistics)" />
  <rect width="640" height="42" fill="#1E293B" opacity="0.9" />
  <circle cx="24" cy="21" r="5" fill="#EF4444" />
  <circle cx="40" cy="21" r="5" fill="#F59E0B" />
  <circle cx="56" cy="21" r="5" fill="#10B981" />
  <rect x="80" y="11" width="280" height="20" rx="6" fill="#0B132B" opacity="0.6" />
  <text x="96" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">transnusantara.co.id/cargo-tracking</text>
  <!-- Sidebar -->
  <rect x="0" y="42" width="60" height="358" fill="#0E1726" />
  <rect x="18" y="60" width="24" height="24" rx="6" fill="#3B82F6" />
  <circle cx="30" cy="115" r="8" fill="#64748B" opacity="0.5" />
  <circle cx="30" cy="155" r="8" fill="#64748B" opacity="0.5" />
  <circle cx="30" cy="195" r="8" fill="#64748B" opacity="0.5" />
  <!-- Main Header -->
  <text x="80" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">TRANSNUSANTARA CARGO</text>
  <text x="80" y="98" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11">National Freight Tracking &amp; Vessel Dispatch</text>
  <!-- Search & Tracking Bar -->
  <rect x="80" y="115" width="530" height="46" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="100" y="143" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Enter AWB / Container No: TNC-882940-JKT</text>
  <rect x="490" y="123" width="110" height="30" rx="8" fill="url(#accentBlue)" />
  <text x="515" y="142" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Track Shipment</text>
  <!-- Live Status Card -->
  <rect x="80" y="175" width="340" height="200" rx="12" fill="#132238" stroke="#1D4ED8" stroke-width="1" />
  <text x="100" y="202" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Container #JKT-SBY-40HC</text>
  <rect x="330" y="188" width="70" height="20" rx="6" fill="#10B981" opacity="0.2" />
  <text x="342" y="202" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">IN TRANSIT</text>
  <!-- Tracking Timeline Steps -->
  <circle cx="106" cy="235" r="6" fill="#3B82F6" />
  <line x1="106" y1="241" x2="106" y2="275" stroke="#3B82F6" stroke-width="2" />
  <text x="122" y="239" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Origin Departure: Tanjung Priok</text>
  <text x="122" y="254" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">24 Sep, 14:30 WIB • Vessel MV Nusantara</text>
  <circle cx="106" cy="285" r="6" fill="#3B82F6" />
  <line x1="106" y1="291" x2="106" y2="325" stroke="#64748B" stroke-width="2" stroke-dasharray="3,3" />
  <text x="122" y="289" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Customs Clearance Verified</text>
  <text x="122" y="304" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Automated e-Permit Cleared</text>
  <circle cx="106" cy="335" r="6" fill="#64748B" />
  <text x="122" y="339" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Destination: Tanjung Perak (ETA Tomorrow)</text>
  <!-- Metrics KPI right side -->
  <rect x="435" y="175" width="175" height="92" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="450" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Active Containers</text>
  <text x="450" y="235" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">1,482</text>
  <text x="450" y="255" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">↑ +18% MoM</text>
  <rect x="435" y="282" width="175" height="92" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="450" y="307" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">On-Time Rate</text>
  <text x="450" y="342" fill="#10B981" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">99.4%</text>
  <text x="450" y="362" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">SLA Guaranteed</text>
</svg>
